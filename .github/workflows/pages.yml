name: Publish Hugo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.158.0
      THEME_REVISION: d6dcedcc75485062723e9f5e8f5d142518b6edef
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Hugo
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Install Bear Blog theme
        run: |
          git init themes/hugo-bearblog
          git -C themes/hugo-bearblog fetch --depth=1 https://github.com/janraasch/hugo-bearblog.git "$THEME_REVISION"
          git -C themes/hugo-bearblog checkout --detach FETCH_HEAD
      - name: Build
        run: |
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
          test -s public/index.html
          test -s public/blog/index.html
          test -s public/blog/hello/index.html
          test -s public/about/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
