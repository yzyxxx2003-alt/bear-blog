media:
  input: static/uploads
  output: /bear-blog/uploads
content:
  - name: homepage
    label: 首页
    type: file
    path: content/_index.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: 页面标题
        type: string
        required: true
      - name: body
        label: 首页正文
        type: rich-text
  - name: posts
    label: 文章
    type: collection
    path: content/blog
    exclude: ["_index.md"]
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 日期
        type: date
        required: true
      - name: draft
        label: 草稿
        type: boolean
        default: true
      - name: body
        label: 正文
        type: rich-text
